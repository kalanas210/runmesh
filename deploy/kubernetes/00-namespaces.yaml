# Two namespaces, and the split is the whole security model.
#
# RunMesh's own control plane runs in one; the workloads it creates on behalf
# of an LLM-authored plan run in the other. That boundary is what makes the
# Role in 10-rbac.yaml meaningful: it grants RunMesh authority over `runmesh-tasks`
# and nowhere else, so a compromised RunMesh cannot touch its own Deployment,
# its own Secret, or anything belonging to another team in the cluster.
#
# One namespace for both would have been simpler and would have quietly granted
# every task pod's neighbour the right to delete the control plane.

apiVersion: v1
kind: Namespace
metadata:
  name: runmesh
  labels:
    app.kubernetes.io/name: runmesh
    app.kubernetes.io/component: control-plane
---
apiVersion: v1
kind: Namespace
metadata:
  name: runmesh-tasks
  labels:
    app.kubernetes.io/name: runmesh
    app.kubernetes.io/component: tasks
    # The sandbox NetworkPolicy in 20-networkpolicy.yaml hangs off this
    # namespace. Calico is installed rather than kind's default CNI so that the
    # policy is actually enforced rather than accepted and ignored — see
    # deploy/kind/cluster.yaml — and deploy/kind/verify-networkpolicy.sh proves
    # it with real pods rather than believing the manifest.
    #
    # kubernetes.io/metadata.name is set automatically by the API server on
    # every namespace, and the DNS egress rule selects kube-system with it. It
    # is not repeated here because a label the control plane maintains is more
    # trustworthy than a copy somebody has to remember to keep.
