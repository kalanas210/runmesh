# The local Kubernetes cluster RunMesh develops and tests against.
#
#   kind create cluster --config deploy/kind/cluster.yaml
#   kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml
#
# deploy/kind/README.md has the whole sequence, including the script that
# proves the NetworkPolicy is enforced.
#
# One decision here matters more than everything else in the file.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: runmesh

networking:
  # kind's default CNI is kindnet, and kindnet DOES NOT ENFORCE NetworkPolicy.
  # Policies apply without error, `kubectl get networkpolicy` lists them, and
  # they silently do nothing at all.
  #
  # That is the worst possible failure mode for a security control: every
  # observable signal says the restriction is in place. Week 4 puts the tool
  # sandbox behind a NetworkPolicy, so discovering this then — with the
  # "restriction" quietly permitting everything — is the outcome this line
  # exists to prevent. Disable the default CNI and install Calico, which does
  # enforce it, and verify enforcement with a pod rather than believing the
  # manifest.
  disableDefaultCNI: true

  # Calico's own default pod CIDR. kind's is 10.244.0.0/16; leaving them
  # mismatched is the usual reason a freshly-installed Calico never gets past
  # the first pod.
  podSubnet: "192.168.0.0/16"

nodes:
  # One control plane and two workers. With workers present, kind keeps the
  # control-plane taint, so task pods land on the workers the way they would on
  # a real cluster, and there is always a second node for a pod to move to.
  #
  # That second node is the point. A step whose node is drained is evicted, the
  # executor classifies the eviction as workload_lost, and the next attempt has
  # to run somewhere else. On one node "somewhere else" does not exist, and the
  # eviction path could only ever be tested by deleting pods by hand. Each
  # worker costs one more node container's worth of memory.
  - role: control-plane
  - role: worker
  - role: worker
